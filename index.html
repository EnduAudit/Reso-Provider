<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Gestione Scarti</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", 'Helvetica Neue', sans-serif; background: linear-gradient(135deg, #0f766e 0%, #1e293b 100%); color: #1e293b; min-height: 100vh; }
    #root { min-height: 100vh; }
    @supports (padding: max(0px)) { body { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); padding-top: max(12px, env(safe-area-inset-top)); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef } = React;

    const ScartiApp = () => {
      const [pezzi, setPezzi] = useState(() => {
        const saved = localStorage.getItem('scarti_pezzi');
        return saved ? JSON.parse(saved) : [];
      });
      const [formData, setFormData] = useState({
        numeroPezzo: '',
        provider: 'Trigo',
        zona: '',
        dmc: '',
        stampoJD: '',
        regoleTolleranze: '',
      });
      const [fotoDifetto, setFotoDifetto] = useState([]);
      const [fotoVerifica, setFotoVerifica] = useState([]);
      const [fotoOperatore, setFotoOperatore] = useState(null);
      const fileDifettoRef = useRef(null);
      const fileVerificaRef = useRef(null);
      const fileOperatoreRef = useRef(null);

      // Salva pezzi in localStorage quando cambiano
      React.useEffect(() => {
        localStorage.setItem('scarti_pezzi', JSON.stringify(pezzi));
      }, [pezzi]);

      const providers = ['Trigo', 'Clavey', 'Ricom'];

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const compressImage = (dataUrl, callback) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          // Ridimensiona a max 800px di larghezza/altezza
          let width = img.width;
          let height = img.height;
          const maxDim = 800;
          
          if (width > height) {
            if (width > maxDim) {
              height = Math.round(height * maxDim / width);
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round(width * maxDim / height);
              height = maxDim;
            }
          }
          
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          
          // Comprimi a JPEG con qualità 70
          const compressedData = canvas.toDataURL('image/jpeg', 0.7);
          callback({ data: compressedData, width, height });
        };
        img.src = dataUrl;
      };

      const handleFotoAdd = (files, type) => {
        if (type === 'difetto') {
          if (fotoDifetto.length >= 2) { alert('Max 2 foto per difetto'); return; }
          Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
              compressImage(e.target.result, (compressed) => {
                setFotoDifetto(prev => [...prev, compressed]);
              });
            };
            reader.readAsDataURL(file);
          });
        } else if (type === 'verifica') {
          if (fotoVerifica.length >= 2) { alert('Max 2 foto per verifica'); return; }
          Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
              compressImage(e.target.result, (compressed) => {
                setFotoVerifica(prev => [...prev, compressed]);
              });
            };
            reader.readAsDataURL(file);
          });
        } else if (type === 'operatore') {
          const file = files[0];
          const reader = new FileReader();
          reader.onload = (e) => {
            compressImage(e.target.result, (compressed) => {
              setFotoOperatore(compressed);
            });
          };
          reader.readAsDataURL(file);
        }
      };

      const removeFoto = (index, type) => {
        if (type === 'difetto') setFotoDifetto(prev => prev.filter((_, i) => i !== index));
        else if (type === 'verifica') setFotoVerifica(prev => prev.filter((_, i) => i !== index));
        else if (type === 'operatore') setFotoOperatore(null);
      };

      const addPezzo = (e) => {
        e.preventDefault();
        if (!formData.numeroPezzo || !formData.dmc || !formData.stampoJD) {
          alert('Compila: N° pezzo, DMC, Stampo e JD');
          return;
        }

        setPezzi(prev => [...prev, {
          ...formData,
          id: Date.now(),
          fotoDifetto, fotoVerifica, fotoOperatore
        }]);

        setFormData({ numeroPezzo: '', provider: 'Trigo', zona: '', dmc: '', stampoJD: '', regoleTolleranze: '' });
        setFotoDifetto([]);
        setFotoVerifica([]);
        setFotoOperatore(null);
      };

      const removePezzo = (id) => setPezzi(prev => prev.filter(p => p.id !== id));

      const generatePDFs = () => {
        const { jsPDF } = window.jspdf;
        const pezziByProvider = {};
        pezzi.forEach(pezzo => {
          if (!pezziByProvider[pezzo.provider]) pezziByProvider[pezzo.provider] = [];
          pezziByProvider[pezzo.provider].push(pezzo);
        });

        Object.entries(pezziByProvider).forEach(([provider, pezziProvider]) => {
          const doc = new jsPDF();
          const pageHeight = doc.internal.pageSize.getHeight();
          let yPosition = 15;

          doc.setFontSize(22);
          doc.setTextColor(15, 118, 110);
          doc.text(`Valutazione scarti - ${provider}`, 15, yPosition);
          
          doc.setFontSize(10);
          doc.setTextColor(100, 100, 100);
          const today = new Date().toLocaleDateString('it-IT');
          doc.text(`Data: ${today}`, 15, yPosition + 8);
          
          yPosition += 20;

          const colWidths = [14, 16, 12, 14, 16, 40, 40, 26, 40];
          const headers = ['N°', 'Fornitore', 'Zona', 'DMC', 'Stampo', 'Foto Difetto', 'Foto Verifica', 'Regole', 'Op.'];
          const startX = 10;
          const headerHeight = 14;
          let currentY = yPosition;

          doc.setFillColor(15, 118, 110);
          doc.setTextColor(255, 255, 255);
          doc.setFont(undefined, 'bold');
          doc.setFontSize(8);
          
          let xPos = startX;
          headers.forEach((header, i) => {
            doc.rect(xPos, currentY, colWidths[i], headerHeight, 'F');
            xPos += colWidths[i];
          });
          
          xPos = startX;
          headers.forEach((header, i) => {
            doc.text(header, xPos + 1, currentY + 10, { maxWidth: colWidths[i] - 2 });
            xPos += colWidths[i];
          });
          
          currentY += headerHeight;
          const rowHeight = 27;

          doc.setTextColor(40, 40, 40);
          doc.setFont(undefined, 'normal');
          
          pezziProvider.forEach((pezzo) => {
            if (currentY + rowHeight > pageHeight - 20) {
              doc.addPage();
              currentY = 15;
            }

            xPos = startX;

            const columns = [
              { w: colWidths[0], value: pezzo.numeroPezzo },
              { w: colWidths[1], value: pezzo.provider },
              { w: colWidths[2], value: pezzo.zona || '-' },
              { w: colWidths[3], value: pezzo.dmc },
              { w: colWidths[4], value: pezzo.stampoJD },
            ];

            columns.forEach(col => {
              doc.rect(xPos, currentY, col.w, rowHeight);
              doc.setFontSize(8);
              doc.text(col.value, xPos + 1, currentY + 5, { maxWidth: col.w - 2 });
              xPos += col.w;
            });

            // Helper per ridimensionare foto mantenendo aspect ratio
            const resizePhotoToHeight = (fotoObj, maxHeight, maxWidth) => {
              if (!fotoObj.width || !fotoObj.height) {
                return { width: maxWidth * 0.8, height: maxHeight * 0.9 };
              }
              const aspectRatio = fotoObj.width / fotoObj.height;
              
              // Calcola dimensioni basate su maxHeight
              let width = maxHeight * aspectRatio;
              let height = maxHeight;
              
              // Se width supera maxWidth, riduci proporzionalmente
              if (width > maxWidth) {
                width = maxWidth;
                height = width / aspectRatio;
              }
              
              return { width, height };
            };

            // Foto Difetto
            doc.rect(xPos, currentY, colWidths[5], rowHeight);
            if (pezzo.fotoDifetto.length > 0) {
              const photoMaxHeight = rowHeight - 4;
              const photoMaxWidth = (colWidths[5] - 4) / pezzo.fotoDifetto.length;
              pezzo.fotoDifetto.forEach((foto, idx) => {
                const dimensions = resizePhotoToHeight(foto, photoMaxHeight, photoMaxWidth);
                const centerX = xPos + 2 + idx * photoMaxWidth + (photoMaxWidth - dimensions.width) / 2;
                doc.addImage(foto.data, 'JPEG', centerX, currentY + 2, dimensions.width, dimensions.height);
              });
            }
            xPos += colWidths[5];

            // Foto Verifica
            doc.rect(xPos, currentY, colWidths[6], rowHeight);
            if (pezzo.fotoVerifica.length > 0) {
              const photoMaxHeight = rowHeight - 4;
              const photoMaxWidth = (colWidths[6] - 4) / pezzo.fotoVerifica.length;
              pezzo.fotoVerifica.forEach((foto, idx) => {
                const dimensions = resizePhotoToHeight(foto, photoMaxHeight, photoMaxWidth);
                const centerX = xPos + 2 + idx * photoMaxWidth + (photoMaxWidth - dimensions.width) / 2;
                doc.addImage(foto.data, 'JPEG', centerX, currentY + 2, dimensions.width, dimensions.height);
              });
            }
            xPos += colWidths[6];

            // Regole
            doc.rect(xPos, currentY, colWidths[7], rowHeight);
            doc.setFontSize(7);
            doc.text(pezzo.regoleTolleranze || '-', xPos + 1, currentY + 3, { maxWidth: colWidths[7] - 2 });
            xPos += colWidths[7];

            // Operatore (foto)
            doc.rect(xPos, currentY, colWidths[8], rowHeight);
            if (pezzo.fotoOperatore) {
              const dimensions = resizePhotoToHeight(pezzo.fotoOperatore, rowHeight - 4, colWidths[8] - 4);
              const centerX = xPos + (colWidths[8] - dimensions.width) / 2;
              doc.addImage(pezzo.fotoOperatore.data, 'JPEG', centerX, currentY + 2, dimensions.width, dimensions.height);
            }

            currentY += rowHeight;
          });;

          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.text(`${provider} - ${today}`, 15, pageHeight - 8);

          doc.save(`Scarti_${provider}_${today.replace(/\//g, '-')}.pdf`);
        });
      };

      const hasDati = pezzi.length > 0;

      return (
        <div style={{ minHeight: '100vh', padding: '20px', paddingBottom: 'max(20px, env(safe-area-inset-bottom))' }}>
          <div style={{ maxWidth: '900px', margin: '0 auto' }}>
            <div style={{ background: 'white', borderRadius: '16px', padding: '28px', marginBottom: '24px', boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)', backdropFilter: 'blur(10px)' }}>
              <h1 style={{ margin: '0 0 8px 0', fontSize: '32px', color: '#0f766e', fontWeight: '700' }}>Gestione Scarti</h1>
              <p style={{ margin: 0, fontSize: '15px', color: '#64748b' }}>Registra pezzi difettosi e genera report PDF professionali</p>
            </div>

            <form onSubmit={addPezzo} style={{ background: 'white', borderRadius: '16px', padding: '28px', marginBottom: '24px', boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)' }}>
              <h2 style={{ fontSize: '18px', color: '#1e293b', marginTop: 0, marginBottom: '24px', fontWeight: '600' }}>Nuovo Pezzo</h2>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', marginBottom: '24px' }}>
                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>N° Pezzo *</label>
                  <input type="text" name="numeroPezzo" value={formData.numeroPezzo} onChange={handleInputChange} placeholder="0308-51" style={{ width: '100%', padding: '12px 14px', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', boxSizing: 'border-box', transition: 'border-color 0.2s', outline: 'none' }} onFocus={(e) => e.target.style.borderColor = '#0f766e'} onBlur={(e) => e.target.style.borderColor = '#e2e8f0'} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Fornitore *</label>
                  <select name="provider" value={formData.provider} onChange={handleInputChange} style={{ width: '100%', padding: '12px 14px', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', boxSizing: 'border-box', outline: 'none' }} onFocus={(e) => e.target.style.borderColor = '#0f766e'} onBlur={(e) => e.target.style.borderColor = '#e2e8f0'}>
                    {providers.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Zona</label>
                  <input type="text" name="zona" value={formData.zona} onChange={handleInputChange} placeholder="G2" style={{ width: '100%', padding: '12px 14px', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', boxSizing: 'border-box', outline: 'none' }} onFocus={(e) => e.target.style.borderColor = '#0f766e'} onBlur={(e) => e.target.style.borderColor = '#e2e8f0'} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>DMC *</label>
                  <input type="text" name="dmc" value={formData.dmc} onChange={handleInputChange} placeholder="38835" style={{ width: '100%', padding: '12px 14px', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', boxSizing: 'border-box', outline: 'none' }} onFocus={(e) => e.target.style.borderColor = '#0f766e'} onBlur={(e) => e.target.style.borderColor = '#e2e8f0'} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Stampo e JD *</label>
                  <input type="text" name="stampoJD" value={formData.stampoJD} onChange={handleInputChange} placeholder="3.2 057" style={{ width: '100%', padding: '12px 14px', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', boxSizing: 'border-box', outline: 'none' }} onFocus={(e) => e.target.style.borderColor = '#0f766e'} onBlur={(e) => e.target.style.borderColor = '#e2e8f0'} />
                </div>
              </div>

              <div style={{ marginBottom: '24px' }}>
                <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Regole e Tolleranze</label>
                <textarea name="regoleTolleranze" value={formData.regoleTolleranze} onChange={handleInputChange} placeholder="Note tecniche..." rows="2" style={{ width: '100%', padding: '12px 14px', border: '2px solid #e2e8f0', borderRadius: '8px', fontSize: '14px', fontFamily: 'inherit', boxSizing: 'border-box', outline: 'none', resize: 'vertical' }} onFocus={(e) => e.target.style.borderColor = '#0f766e'} onBlur={(e) => e.target.style.borderColor = '#e2e8f0'} />
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '20px', marginBottom: '24px' }}>
                {/* Foto Difetto */}
                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Foto Difetto ({fotoDifetto.length}/2)</label>
                  <div onClick={() => fileDifettoRef.current?.click()} style={{ border: '2px dashed #cbd5e1', borderRadius: '10px', padding: '18px 12px', textAlign: 'center', cursor: 'pointer', background: '#f8fafc', transition: 'all 0.2s' }} onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#0f766e'; e.currentTarget.style.background = '#f0fdfb'; }} onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#cbd5e1'; e.currentTarget.style.background = '#f8fafc'; }}>
                    <p style={{ margin: 0, color: '#0f766e', fontWeight: '600', fontSize: '13px' }}>📸 Aggiungi</p>
                  </div>
                  <input ref={fileDifettoRef} type="file" multiple accept="image/*" onChange={(e) => handleFotoAdd(e.target.files, 'difetto')} style={{ display: 'none' }} />
                  {fotoDifetto.length > 0 && (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px', marginTop: '10px' }}>
                      {fotoDifetto.map((foto, idx) => (
                        <div key={idx} style={{ position: 'relative', borderRadius: '8px', overflow: 'hidden', border: '2px solid #e2e8f0' }}>
                          <img src={foto} alt="" style={{ width: '100%', height: '50px', objectFit: 'cover' }} />
                          <button type="button" onClick={() => removeFoto(idx, 'difetto')} style={{ position: 'absolute', top: '2px', right: '2px', background: '#ef4444', border: 'none', color: 'white', borderRadius: '4px', padding: '2px 6px', fontSize: '11px', cursor: 'pointer', fontWeight: '600' }}>✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Foto Verifica */}
                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Foto Verifica ({fotoVerifica.length}/2)</label>
                  <div onClick={() => fileVerificaRef.current?.click()} style={{ border: '2px dashed #cbd5e1', borderRadius: '10px', padding: '18px 12px', textAlign: 'center', cursor: 'pointer', background: '#f8fafc', transition: 'all 0.2s' }} onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#0f766e'; e.currentTarget.style.background = '#f0fdfb'; }} onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#cbd5e1'; e.currentTarget.style.background = '#f8fafc'; }}>
                    <p style={{ margin: 0, color: '#0f766e', fontWeight: '600', fontSize: '13px' }}>📸 Aggiungi</p>
                  </div>
                  <input ref={fileVerificaRef} type="file" multiple accept="image/*" onChange={(e) => handleFotoAdd(e.target.files, 'verifica')} style={{ display: 'none' }} />
                  {fotoVerifica.length > 0 && (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px', marginTop: '10px' }}>
                      {fotoVerifica.map((foto, idx) => (
                        <div key={idx} style={{ position: 'relative', borderRadius: '8px', overflow: 'hidden', border: '2px solid #e2e8f0' }}>
                          <img src={foto} alt="" style={{ width: '100%', height: '50px', objectFit: 'cover' }} />
                          <button type="button" onClick={() => removeFoto(idx, 'verifica')} style={{ position: 'absolute', top: '2px', right: '2px', background: '#ef4444', border: 'none', color: 'white', borderRadius: '4px', padding: '2px 6px', fontSize: '11px', cursor: 'pointer', fontWeight: '600' }}>✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Foto Operatore */}
                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#0f766e', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Foto Operatore</label>
                  <div onClick={() => fileOperatoreRef.current?.click()} style={{ border: '2px dashed #cbd5e1', borderRadius: '10px', padding: '18px 12px', textAlign: 'center', cursor: 'pointer', background: '#f8fafc', transition: 'all 0.2s' }} onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#0f766e'; e.currentTarget.style.background = '#f0fdfb'; }} onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#cbd5e1'; e.currentTarget.style.background = '#f8fafc'; }}>
                    <p style={{ margin: 0, color: '#0f766e', fontWeight: '600', fontSize: '13px' }}>📸 Aggiungi</p>
                  </div>
                  <input ref={fileOperatoreRef} type="file" accept="image/*" onChange={(e) => handleFotoAdd(e.target.files, 'operatore')} style={{ display: 'none' }} />
                  {fotoOperatore && (
                    <div style={{ position: 'relative', borderRadius: '8px', overflow: 'hidden', border: '2px solid #e2e8f0', marginTop: '10px' }}>
                      <img src={fotoOperatore} alt="" style={{ width: '100%', height: '60px', objectFit: 'cover' }} />
                      <button type="button" onClick={() => removeFoto(0, 'operatore')} style={{ position: 'absolute', top: '2px', right: '2px', background: '#ef4444', border: 'none', color: 'white', borderRadius: '4px', padding: '2px 6px', fontSize: '11px', cursor: 'pointer', fontWeight: '600' }}>✕</button>
                    </div>
                  )}
                </div>
              </div>

              <button type="submit" style={{ width: '100%', padding: '14px', background: 'linear-gradient(135deg, #0f766e 0%, #0d5c57 100%)', color: 'white', border: 'none', borderRadius: '8px', fontSize: '15px', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s, box-shadow 0.2s', boxShadow: '0 4px 6px rgba(15, 118, 110, 0.2)' }} onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = '0 8px 12px rgba(15, 118, 110, 0.3)'; }} onMouseLeave={(e) => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 6px rgba(15, 118, 110, 0.2)'; }}>✚ Aggiungi Pezzo</button>
            </form>

            {hasDati && (
              <div style={{ background: 'white', borderRadius: '16px', padding: '28px', marginBottom: '24px', boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)' }}>
                <h2 style={{ fontSize: '18px', color: '#1e293b', marginTop: 0, marginBottom: '20px', fontWeight: '600' }}>Pezzi Registrati ({pezzi.length})</h2>
                {providers.map(provider => {
                  const pezziProvider = pezzi.filter(p => p.provider === provider);
                  if (pezziProvider.length === 0) return null;
                  return (
                    <div key={provider} style={{ background: 'linear-gradient(135deg, #f0fdfb 0%, #f8fafc 100%)', border: '1px solid #d1e7e4', borderRadius: '12px', padding: '16px', marginBottom: '16px' }}>
                      <h3 style={{ margin: '0 0 12px 0', fontSize: '15px', fontWeight: '600', color: '#0f766e' }}>📦 {provider} ({pezziProvider.length})</h3>
                      <div style={{ display: 'grid', gap: '10px' }}>
                        {pezziProvider.map(pezzo => (
                          <div key={pezzo.id} style={{ background: 'white', padding: '12px', borderRadius: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', border: '1px solid #e2e8f0' }}>
                            <div style={{ flex: 1, fontSize: '13px' }}>
                              <strong style={{ color: '#0f766e' }}>{pezzo.numeroPezzo}</strong> • DMC: {pezzo.dmc} • JD: {pezzo.stampoJD}
                            </div>
                            <button onClick={() => removePezzo(pezzo.id)} style={{ background: '#ef4444', color: 'white', border: 'none', borderRadius: '6px', padding: '6px 12px', cursor: 'pointer', fontSize: '12px', fontWeight: '600', transition: 'background 0.2s' }} onMouseEnter={(e) => e.currentTarget.style.background = '#dc2626'} onMouseLeave={(e) => e.currentTarget.style.background = '#ef4444'}>✕ Rimuovi</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
                <button onClick={generatePDFs} style={{ width: '100%', padding: '14px', background: 'linear-gradient(135deg, #059669 0%, #047857 100%)', color: 'white', border: 'none', borderRadius: '8px', fontSize: '15px', fontWeight: '600', cursor: 'pointer', marginTop: '20px', transition: 'transform 0.2s, box-shadow 0.2s', boxShadow: '0 4px 6px rgba(5, 150, 105, 0.2)' }} onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = '0 8px 12px rgba(5, 150, 105, 0.3)'; }} onMouseLeave={(e) => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 6px rgba(5, 150, 105, 0.2)'; }}>⬇️ Genera PDF per Fornitore</button>
                <button onClick={() => { if (confirm('Cancellare tutti i pezzi?')) { setPezzi([]); } }} style={{ width: '100%', padding: '12px', background: '#ef4444', color: 'white', border: 'none', borderRadius: '8px', fontSize: '14px', fontWeight: '600', cursor: 'pointer', marginTop: '10px', transition: 'background 0.2s' }} onMouseEnter={(e) => e.currentTarget.style.background = '#dc2626'} onMouseLeave={(e) => e.currentTarget.style.background = '#ef4444'}>🗑️ Svuota tutto</button>
              </div>
            )}

            {!hasDati && (
              <div style={{ background: 'white', borderRadius: '16px', padding: '60px 24px', textAlign: 'center', boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)' }}>
                <p style={{ fontSize: '48px', margin: '0 0 16px 0' }}>📋</p>
                <p style={{ color: '#64748b', fontSize: '15px', margin: 0 }}>Inizia aggiungendo il primo pezzo</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<ScartiApp />);
  </script>
</body>
</html>

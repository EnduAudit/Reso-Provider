<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3498db">
  <meta name="description" content="Gestione scarti e difetti - Genera PDF per provider">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%233498db' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>S</text></svg>">
  <title>Gestione Scarti</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #2c3e50;
    }
    
    #root {
      min-height: 100vh;
    }

    @supports (padding: max(0px)) {
      body {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        padding-top: max(12px, env(safe-area-inset-top));
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

  <!-- Librerie per PDF (PRIMA) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- App -->
  <script type="text/babel">
    const { useState, useRef } = React;

    const ScartiApp = () => {
      const [pezzi, setPezzi] = useState([]);
      const [formData, setFormData] = useState({
        numeroPezzo: '',
        provider: 'Trigo',
        difetto: '',
        zona: '',
        dmc: '',
        stampoJD: '',
        verifica: false,
        regoleTolleranze: '',
        operatore: '',
      });
      const [fotoPreview, setFotoPreview] = useState([]);
      const fileInputRef = useRef(null);

      const providers = ['Trigo', 'Clavey', 'Ricom'];

      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      const handleFotoAdd = (e) => {
        const files = Array.from(e.target.files);
        if (fotoPreview.length + files.length > 4) {
          alert('Massimo 4 foto');
          return;
        }
        
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            setFotoPreview(prev => [...prev, {
              data: event.target.result,
              name: file.name
            }]);
          };
          reader.readAsDataURL(file);
        });
      };

      const removeFoto = (index) => {
        setFotoPreview(prev => prev.filter((_, i) => i !== index));
      };

      const addPezzo = (e) => {
        e.preventDefault();
        
        if (!formData.numeroPezzo || !formData.dmc || !formData.stampoJD) {
          alert('Compila: N° pezzo, DMC, Stampo e JD');
          return;
        }

        if (formData.difetto && !formData.zona) {
          alert('Se c\'è un difetto, specifica la zona');
          return;
        }

        const pezzo = {
          ...formData,
          id: Date.now(),
          foto: fotoPreview
        };

        setPezzi(prev => [...prev, pezzo]);
        
        setFormData({
          numeroPezzo: '',
          provider: 'Trigo',
          difetto: '',
          zona: '',
          dmc: '',
          stampoJD: '',
          verifica: false,
          regoleTolleranze: '',
          operatore: '',
        });
        setFotoPreview([]);
      };

      const removePezzo = (id) => {
        setPezzi(prev => prev.filter(p => p.id !== id));
      };

      const generatePDFs = () => {
        const { jsPDF } = window.jspdf;
        
        const pezziByProvider = {};
        pezzi.forEach(pezzo => {
          if (!pezziByProvider[pezzo.provider]) {
            pezziByProvider[pezzo.provider] = [];
          }
          pezziByProvider[pezzo.provider].push(pezzo);
        });

        Object.entries(pezziByProvider).forEach(([provider, pezziProvider]) => {
          const doc = new jsPDF();
          const pageHeight = doc.internal.pageSize.getHeight();
          let yPosition = 20;

          // Header
          doc.setFontSize(20);
          doc.setTextColor(40, 40, 40);
          doc.text(`Contestazione Scarti - ${provider}`, 15, yPosition);
          
          doc.setFontSize(10);
          doc.setTextColor(100, 100, 100);
          const today = new Date().toLocaleDateString('it-IT');
          doc.text(`Data: ${today}`, 15, yPosition + 10);
          
          yPosition += 25;

          // Tabella riepilogo
          const tableData = pezziProvider.map(p => [
            p.numeroPezzo,
            p.dmc,
            p.stampoJD,
            p.difetto || '-',
            p.zona || '-',
            p.operatore || '-'
          ]);

          window.autoTable(doc, {
            startY: yPosition,
            head: [['N° Pezzo', 'DMC', 'Stampo JD', 'Difetto', 'Zona', 'Operatore']],
            body: tableData,
            theme: 'grid',
            styles: {
              fontSize: 9,
              cellPadding: 4,
              textColor: [40, 40, 40]
            },
            headStyles: {
              fillColor: [60, 100, 140],
              textColor: [255, 255, 255],
              fontStyle: 'bold'
            },
            alternateRowStyles: {
              fillColor: [245, 245, 245]
            }
          });

          yPosition = doc.lastAutoTable.finalY + 15;

          // Foto per ogni pezzo
          pezziProvider.forEach((pezzo) => {
            if (pezzo.foto.length === 0) return;

            if (yPosition > pageHeight - 100) {
              doc.addPage();
              yPosition = 20;
            }

            doc.setFontSize(12);
            doc.setTextColor(60, 100, 140);
            doc.text(`Pezzo: ${pezzo.numeroPezzo}`, 15, yPosition);
            yPosition += 10;

            // Foto in griglia 2x2
            const fotoPerRiga = 2;
            const fotoWidth = 70;
            const fotoHeight = 70;
            const spacing = 10;

            pezzo.foto.forEach((foto, fotoIndex) => {
              const col = fotoIndex % fotoPerRiga;
              const row = Math.floor(fotoIndex / fotoPerRiga);
              const x = 15 + col * (fotoWidth + spacing);
              const y = yPosition + row * (fotoHeight + spacing);

              if (y + fotoHeight > pageHeight - 20) {
                doc.addPage();
                yPosition = 20;
                const fotoRimanenti = pezzo.foto.slice(fotoIndex);
                fotoRimanenti.forEach((f, idx) => {
                  const col = idx % fotoPerRiga;
                  const row = Math.floor(idx / fotoPerRiga);
                  const x = 15 + col * (fotoWidth + spacing);
                  const y = yPosition + row * (fotoHeight + spacing);
                  doc.addImage(f.data, 'JPEG', x, y, fotoWidth, fotoHeight);
                });
                return;
              }

              doc.addImage(foto.data, 'JPEG', x, y, fotoWidth, fotoHeight);
            });

            yPosition += Math.ceil(pezzo.foto.length / fotoPerRiga) * (fotoHeight + spacing) + 10;

            // Note
            if (pezzo.regoleTolleranze || pezzo.verifica) {
              yPosition += 5;
              doc.setFontSize(9);
              doc.setTextColor(100, 100, 100);
              if (pezzo.verifica) {
                doc.text(`Verifica: Sì`, 15, yPosition);
                yPosition += 5;
              }
              if (pezzo.regoleTolleranze) {
                const lines = doc.splitTextToSize(pezzo.regoleTolleranze, 170);
                doc.text(lines, 15, yPosition);
                yPosition += lines.length * 4 + 5;
              }
            }

            yPosition += 10;
          });

          // Footer
          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.text(`${provider} - ${today}`, 15, pageHeight - 10);

          doc.save(`Scarti_${provider}_${today.replace(/\//g, '-')}.pdf`);
        });
      };

      const hasDati = pezzi.length > 0;

      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)',
          padding: '20px',
          paddingBottom: 'max(20px, env(safe-area-inset-bottom))',
        }}>
          <div style={{ maxWidth: '900px', margin: '0 auto' }}>
            {/* Header */}
            <div style={{
              background: 'white',
              borderRadius: '12px',
              padding: '24px',
              marginBottom: '24px',
              boxShadow: '0 2px 8px rgba(0,0,0,0.1)'
            }}>
              <h1 style={{ margin: '0 0 8px 0', fontSize: '28px', color: '#2c3e50', fontWeight: '600' }}>
                Gestione Scarti
              </h1>
              <p style={{ margin: 0, fontSize: '14px', color: '#7f8c8d' }}>
                Registra pezzi difettosi e genera PDF per provider
              </p>
            </div>

            {/* Form */}
            <form onSubmit={addPezzo} style={{
              background: 'white',
              borderRadius: '12px',
              padding: '24px',
              marginBottom: '24px',
              boxShadow: '0 2px 8px rgba(0,0,0,0.1)'
            }}>
              <h2 style={{ fontSize: '16px', color: '#2c3e50', marginTop: 0, marginBottom: '20px', fontWeight: '600' }}>
                Aggiungi Pezzo
              </h2>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                    N° Pezzo *
                  </label>
                  <input type="text" name="numeroPezzo" value={formData.numeroPezzo} onChange={handleInputChange} placeholder="0308-51" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                    Provider *
                  </label>
                  <select name="provider" value={formData.provider} onChange={handleInputChange} style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }}>
                    {providers.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                    DMC *
                  </label>
                  <input type="text" name="dmc" value={formData.dmc} onChange={handleInputChange} placeholder="38835" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                    Stampo e JD *
                  </label>
                  <input type="text" name="stampoJD" value={formData.stampoJD} onChange={handleInputChange} placeholder="3.2 057" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                    Difetto
                  </label>
                  <input type="text" name="difetto" value={formData.difetto} onChange={handleInputChange} placeholder="Mancanza materiale" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                    Zona
                  </label>
                  <input type="text" name="zona" value={formData.zona} onChange={handleInputChange} placeholder="G2" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                    Operatore
                  </label>
                  <input type="text" name="operatore" value={formData.operatore} onChange={handleInputChange} placeholder="Nome" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'flex', alignItems: 'center', fontSize: '14px', gap: '8px', cursor: 'pointer', marginTop: '24px' }}>
                    <input type="checkbox" name="verifica" checked={formData.verifica} onChange={handleInputChange} style={{ width: '16px', height: '16px' }} />
                    <span style={{ color: '#2c3e50', fontWeight: '500' }}>Verificato</span>
                  </label>
                </div>
              </div>

              <div style={{ marginBottom: '16px' }}>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>
                  Regole e Tolleranze
                </label>
                <textarea name="regoleTolleranze" value={formData.regoleTolleranze} onChange={handleInputChange} placeholder="Note..." rows="3" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', fontFamily: 'inherit', boxSizing: 'border-box' }} />
              </div>

              {/* Foto */}
              <div style={{ marginBottom: '16px' }}>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '12px' }}>
                  Foto ({fotoPreview.length}/4)
                </label>
                
                <div onClick={() => fileInputRef.current?.click()} style={{ border: '2px dashed #bdc3c7', borderRadius: '8px', padding: '40px 20px', textAlign: 'center', cursor: 'pointer', background: '#f8f9fa', marginBottom: '12px' }}>
                  <p style={{ margin: 0, color: '#2c3e50', fontWeight: '500' }}>📸 Aggiungi foto</p>
                  <p style={{ margin: '4px 0 0 0', fontSize: '12px', color: '#7f8c8d' }}>Clicca per selezionare</p>
                </div>

                <input ref={fileInputRef} type="file" multiple accept="image/*" onChange={handleFotoAdd} style={{ display: 'none' }} />

                {fotoPreview.length > 0 && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(80px, 1fr))', gap: '12px' }}>
                    {fotoPreview.map((foto, idx) => (
                      <div key={idx} style={{ position: 'relative', borderRadius: '8px', overflow: 'hidden', background: '#eee' }}>
                        <img src={foto.data} alt={`Foto ${idx + 1}`} style={{ width: '100%', height: '80px', objectFit: 'cover' }} />
                        <button type="button" onClick={() => removeFoto(idx)} style={{ position: 'absolute', top: '4px', right: '4px', background: 'rgba(0,0,0,0.6)', border: 'none', color: 'white', borderRadius: '4px', cursor: 'pointer', padding: '4px', fontSize: '14px' }}>
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <button type="submit" style={{ width: '100%', padding: '12px', background: '#3498db', color: 'white', border: 'none', borderRadius: '6px', fontSize: '14px', fontWeight: '600', cursor: 'pointer' }}>
                ➕ Aggiungi Pezzo
              </button>
            </form>

            {/* Lista Pezzi */}
            {hasDati && (
              <div style={{ background: 'white', borderRadius: '12px', padding: '24px', marginBottom: '24px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
                <h2 style={{ fontSize: '16px', color: '#2c3e50', marginTop: 0, marginBottom: '16px', fontWeight: '600' }}>
                  Pezzi Aggiunti ({pezzi.length})
                </h2>

                {providers.map(provider => {
                  const pezziProvider = pezzi.filter(p => p.provider === provider);
                  if (pezziProvider.length === 0) return null;

                  return (
                    <div key={provider} style={{ background: '#f8f9fa', border: '1px solid #ecf0f1', borderRadius: '8px', padding: '12px', marginBottom: '12px' }}>
                      <h3 style={{ margin: '0 0 12px 0', fontSize: '14px', fontWeight: '600', color: '#2c3e50' }}>
                        {provider} ({pezziProvider.length})
                      </h3>
                      <div style={{ display: 'grid', gap: '8px' }}>
                        {pezziProvider.map(pezzo => (
                          <div key={pezzo.id} style={{ background: 'white', padding: '12px', borderRadius: '6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', border: '1px solid #ecf0f1' }}>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontWeight: '600', color: '#2c3e50', fontSize: '14px' }}>{pezzo.numeroPezzo}</div>
                              <div style={{ fontSize: '12px', color: '#7f8c8d', marginTop: '4px' }}>
                                DMC: {pezzo.dmc} | JD: {pezzo.stampoJD} {pezzo.foto.length > 0 && `| 📸 ${pezzo.foto.length}`}
                              </div>
                            </div>
                            <button onClick={() => removePezzo(pezzo.id)} style={{ background: '#e74c3c', color: 'white', border: 'none', borderRadius: '6px', padding: '6px 12px', cursor: 'pointer', fontSize: '12px', fontWeight: '500' }}>
                              ✕ Rimuovi
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}

                <button onClick={generatePDFs} style={{ width: '100%', padding: '14px', background: '#27ae60', color: 'white', border: 'none', borderRadius: '6px', fontSize: '14px', fontWeight: '600', cursor: 'pointer', marginTop: '16px' }}>
                  ⬇️ Genera PDF per Provider
                </button>
              </div>
            )}

            {!hasDati && (
              <div style={{ background: 'white', borderRadius: '12px', padding: '60px 24px', textAlign: 'center', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
                <p style={{ fontSize: '32px', margin: '0 0 16px 0' }}>📋</p>
                <p style={{ color: '#7f8c8d', fontSize: '14px', margin: 0 }}>Aggiungi il primo pezzo per iniziare</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<ScartiApp />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3498db">
  <title>Gestione Scarti</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #2c3e50; }
    #root { min-height: 100vh; }
    @supports (padding: max(0px)) { body { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); padding-top: max(12px, env(safe-area-inset-top)); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef } = React;

    const ScartiApp = () => {
      const [pezzi, setPezzi] = useState([]);
      const [formData, setFormData] = useState({
        numeroPezzo: '',
        provider: 'Trigo',
        zona: '',
        dmc: '',
        stampoJD: '',
        verifica: false,
        regoleTolleranze: '',
      });
      const [fotoDifetto, setFotoDifetto] = useState([]);
      const [fotoVerifica, setFotoVerifica] = useState([]);
      const fileDifettoRef = useRef(null);
      const fileVerificaRef = useRef(null);

      const providers = ['Trigo', 'Clavey', 'Ricom'];

      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
      };

      const handleFotoAdd = (files, type) => {
        if (type === 'difetto') {
          if (fotoDifetto.length >= 2) {
            alert('Max 2 foto per difetto');
            return;
          }
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => setFotoDifetto(prev => [...prev, e.target.result]);
            reader.readAsDataURL(file);
          });
        } else {
          if (fotoVerifica.length >= 2) {
            alert('Max 2 foto per verifica');
            return;
          }
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => setFotoVerifica(prev => [...prev, e.target.result]);
            reader.readAsDataURL(file);
          });
        }
      };

      const removeFoto = (index, type) => {
        if (type === 'difetto') {
          setFotoDifetto(prev => prev.filter((_, i) => i !== index));
        } else {
          setFotoVerifica(prev => prev.filter((_, i) => i !== index));
        }
      };

      const addPezzo = (e) => {
        e.preventDefault();
        
        if (!formData.numeroPezzo || !formData.dmc || !formData.stampoJD) {
          alert('Compila: N° pezzo, DMC, Stampo e JD');
          return;
        }

        const pezzo = {
          ...formData,
          id: Date.now(),
          fotoDifetto: fotoDifetto,
          fotoVerifica: fotoVerifica
        };

        setPezzi(prev => [...prev, pezzo]);
        setFormData({
          numeroPezzo: '',
          provider: 'Trigo',
          zona: '',
          dmc: '',
          stampoJD: '',
          verifica: false,
          regoleTolleranze: '',
        });
        setFotoDifetto([]);
        setFotoVerifica([]);
      };

      const removePezzo = (id) => {
        setPezzi(prev => prev.filter(p => p.id !== id));
      };

      const generatePDFs = () => {
        const { jsPDF } = window.jspdf;
        
        const pezziByProvider = {};
        pezzi.forEach(pezzo => {
          if (!pezziByProvider[pezzo.provider]) {
            pezziByProvider[pezzo.provider] = [];
          }
          pezziByProvider[pezzo.provider].push(pezzo);
        });

        Object.entries(pezziByProvider).forEach(([provider, pezziProvider]) => {
          const doc = new jsPDF('l');
          const pageWidth = doc.internal.pageSize.getWidth();
          const pageHeight = doc.internal.pageSize.getHeight();
          let yPosition = 20;

          doc.setFontSize(20);
          doc.setTextColor(40, 40, 40);
          doc.text(`Contestazione Scarti - ${provider}`, 15, yPosition);
          
          doc.setFontSize(10);
          doc.setTextColor(100, 100, 100);
          const today = new Date().toLocaleDateString('it-IT');
          doc.text(`Data: ${today}`, 15, yPosition + 10);
          
          yPosition += 25;

          // Header tabella
          const colWidths = [18, 18, 15, 18, 20, 20, 28, 28, 32, 15];
          const headers = ['N°', 'Provider', 'Zona', 'DMC', 'Stampo JD', 'Verifica', 'Foto Difetto', 'Foto Verifica', 'Regole e Tolleranze', 'Info'];
          const startX = 9;
          const headerHeight = 10;
          let currentY = yPosition;

          doc.setFontSize(8);
          doc.setFillColor(60, 100, 140);
          doc.setTextColor(255, 255, 255);
          doc.setFont(undefined, 'bold');
          
          let xPos = startX;
          headers.forEach((header, i) => {
            doc.rect(xPos, currentY, colWidths[i], headerHeight, 'F');
            doc.text(header, xPos + 2, currentY + 6, { maxWidth: colWidths[i] - 4, fontSize: 7 });
            xPos += colWidths[i];
          });
          
          currentY += headerHeight;
          const rowHeight = 45;

          // Righe dati
          doc.setTextColor(40, 40, 40);
          doc.setFont(undefined, 'normal');
          
          pezziProvider.forEach((pezzo, pezzoIdx) => {
            if (currentY + rowHeight > pageHeight - 20) {
              doc.addPage();
              currentY = 20;
            }

            xPos = startX;

            // N° Pezzo
            doc.rect(xPos, currentY, colWidths[0], rowHeight);
            doc.text(pezzo.numeroPezzo, xPos + 2, currentY + 5, { maxWidth: colWidths[0] - 4, fontSize: 8 });
            xPos += colWidths[0];

            // Provider
            doc.rect(xPos, currentY, colWidths[1], rowHeight);
            doc.text(pezzo.provider, xPos + 2, currentY + 5, { maxWidth: colWidths[1] - 4, fontSize: 8 });
            xPos += colWidths[1];

            // Zona
            doc.rect(xPos, currentY, colWidths[2], rowHeight);
            doc.text(pezzo.zona || '-', xPos + 2, currentY + 5, { maxWidth: colWidths[2] - 4, fontSize: 8 });
            xPos += colWidths[2];

            // DMC
            doc.rect(xPos, currentY, colWidths[3], rowHeight);
            doc.text(pezzo.dmc, xPos + 2, currentY + 5, { maxWidth: colWidths[3] - 4, fontSize: 8 });
            xPos += colWidths[3];

            // Stampo JD
            doc.rect(xPos, currentY, colWidths[4], rowHeight);
            doc.text(pezzo.stampoJD, xPos + 2, currentY + 5, { maxWidth: colWidths[4] - 4, fontSize: 8 });
            xPos += colWidths[4];

            // Verifica (Sì/No)
            doc.rect(xPos, currentY, colWidths[5], rowHeight);
            doc.text(pezzo.verifica ? 'Sì' : 'No', xPos + 2, currentY + 5, { maxWidth: colWidths[5] - 4, fontSize: 8 });
            xPos += colWidths[5];

            // Foto Difetto
            doc.rect(xPos, currentY, colWidths[6], rowHeight);
            if (pezzo.fotoDifetto.length > 0) {
              const fotoSize = 20;
              const spacing = 2;
              pezzo.fotoDifetto.forEach((foto, idx) => {
                const fx = xPos + 2 + idx * (fotoSize + spacing);
                const fy = currentY + 2;
                doc.addImage(foto, 'JPEG', fx, fy, fotoSize, fotoSize);
              });
            }
            xPos += colWidths[6];

            // Foto Verifica
            doc.rect(xPos, currentY, colWidths[7], rowHeight);
            if (pezzo.fotoVerifica.length > 0) {
              const fotoSize = 20;
              const spacing = 2;
              pezzo.fotoVerifica.forEach((foto, idx) => {
                const fx = xPos + 2 + idx * (fotoSize + spacing);
                const fy = currentY + 2;
                doc.addImage(foto, 'JPEG', fx, fy, fotoSize, fotoSize);
              });
            }
            xPos += colWidths[7];

            // Regole e Tolleranze
            doc.rect(xPos, currentY, colWidths[8], rowHeight);
            doc.text(pezzo.regoleTolleranze || '-', xPos + 2, currentY + 5, { maxWidth: colWidths[8] - 4, fontSize: 7 });
            xPos += colWidths[8];

            // Info
            doc.rect(xPos, currentY, colWidths[9], rowHeight);
            xPos += colWidths[9];

            currentY += rowHeight;
          });

          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.text(`${provider} - ${today}`, 15, pageHeight - 10);

          doc.save(`Scarti_${provider}_${today.replace(/\//g, '-')}.pdf`);
        });
      };

      const hasDati = pezzi.length > 0;

      return (
        <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)', padding: '20px' }}>
          <div style={{ maxWidth: '900px', margin: '0 auto' }}>
            <div style={{ background: 'white', borderRadius: '12px', padding: '24px', marginBottom: '24px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
              <h1 style={{ margin: '0 0 8px 0', fontSize: '28px', color: '#2c3e50', fontWeight: '600' }}>Gestione Scarti</h1>
              <p style={{ margin: 0, fontSize: '14px', color: '#7f8c8d' }}>Registra pezzi e genera PDF</p>
            </div>

            <form onSubmit={addPezzo} style={{ background: 'white', borderRadius: '12px', padding: '24px', marginBottom: '24px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
              <h2 style={{ fontSize: '16px', color: '#2c3e50', marginTop: 0, marginBottom: '20px', fontWeight: '600' }}>Aggiungi Pezzo</h2>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>N° Pezzo *</label>
                  <input type="text" name="numeroPezzo" value={formData.numeroPezzo} onChange={handleInputChange} placeholder="0308-51" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>Provider *</label>
                  <select name="provider" value={formData.provider} onChange={handleInputChange} style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }}>
                    {providers.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>Zona</label>
                  <input type="text" name="zona" value={formData.zona} onChange={handleInputChange} placeholder="G2" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>DMC *</label>
                  <input type="text" name="dmc" value={formData.dmc} onChange={handleInputChange} placeholder="38835" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>Stampo e JD *</label>
                  <input type="text" name="stampoJD" value={formData.stampoJD} onChange={handleInputChange} placeholder="3.2 057" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', boxSizing: 'border-box' }} />
                </div>

                <div>
                  <label style={{ display: 'flex', alignItems: 'center', fontSize: '14px', gap: '8px', cursor: 'pointer', marginTop: '24px' }}>
                    <input type="checkbox" name="verifica" checked={formData.verifica} onChange={handleInputChange} style={{ width: '16px', height: '16px' }} />
                    <span style={{ color: '#2c3e50', fontWeight: '500' }}>Verificato</span>
                  </label>
                </div>
              </div>

              <div style={{ marginBottom: '16px' }}>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '6px' }}>Regole e Tolleranze</label>
                <textarea name="regoleTolleranze" value={formData.regoleTolleranze} onChange={handleInputChange} placeholder="Note..." rows="2" style={{ width: '100%', padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px', fontFamily: 'inherit', boxSizing: 'border-box' }} />
              </div>

              {/* Foto Difetto */}
              <div style={{ marginBottom: '16px' }}>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '8px' }}>Foto Difetto ({fotoDifetto.length}/2)</label>
                <div onClick={() => fileDifettoRef.current?.click()} style={{ border: '2px dashed #bdc3c7', borderRadius: '8px', padding: '20px', textAlign: 'center', cursor: 'pointer', background: '#f8f9fa', marginBottom: '8px' }}>
                  <p style={{ margin: 0, color: '#2c3e50', fontWeight: '500', fontSize: '14px' }}>📸 Aggiungi foto difetto</p>
                </div>
                <input ref={fileDifettoRef} type="file" multiple accept="image/*" onChange={(e) => handleFotoAdd(Array.from(e.target.files), 'difetto')} style={{ display: 'none' }} />
                {fotoDifetto.length > 0 && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px' }}>
                    {fotoDifetto.map((foto, idx) => (
                      <div key={idx} style={{ position: 'relative', borderRadius: '6px', overflow: 'hidden' }}>
                        <img src={foto} alt="" style={{ width: '100%', height: '60px', objectFit: 'cover' }} />
                        <button type="button" onClick={() => removeFoto(idx, 'difetto')} style={{ position: 'absolute', top: '2px', right: '2px', background: 'rgba(0,0,0,0.6)', border: 'none', color: 'white', borderRadius: '3px', padding: '2px 4px', fontSize: '12px', cursor: 'pointer' }}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Foto Verifica */}
              <div style={{ marginBottom: '16px' }}>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '500', color: '#2c3e50', marginBottom: '8px' }}>Foto Verifica ({fotoVerifica.length}/2)</label>
                <div onClick={() => fileVerificaRef.current?.click()} style={{ border: '2px dashed #bdc3c7', borderRadius: '8px', padding: '20px', textAlign: 'center', cursor: 'pointer', background: '#f8f9fa', marginBottom: '8px' }}>
                  <p style={{ margin: 0, color: '#2c3e50', fontWeight: '500', fontSize: '14px' }}>📸 Aggiungi foto verifica</p>
                </div>
                <input ref={fileVerificaRef} type="file" multiple accept="image/*" onChange={(e) => handleFotoAdd(Array.from(e.target.files), 'verifica')} style={{ display: 'none' }} />
                {fotoVerifica.length > 0 && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px' }}>
                    {fotoVerifica.map((foto, idx) => (
                      <div key={idx} style={{ position: 'relative', borderRadius: '6px', overflow: 'hidden' }}>
                        <img src={foto} alt="" style={{ width: '100%', height: '60px', objectFit: 'cover' }} />
                        <button type="button" onClick={() => removeFoto(idx, 'verifica')} style={{ position: 'absolute', top: '2px', right: '2px', background: 'rgba(0,0,0,0.6)', border: 'none', color: 'white', borderRadius: '3px', padding: '2px 4px', fontSize: '12px', cursor: 'pointer' }}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <button type="submit" style={{ width: '100%', padding: '12px', background: '#3498db', color: 'white', border: 'none', borderRadius: '6px', fontSize: '14px', fontWeight: '600', cursor: 'pointer' }}>➕ Aggiungi Pezzo</button>
            </form>

            {hasDati && (
              <div style={{ background: 'white', borderRadius: '12px', padding: '24px', marginBottom: '24px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
                <h2 style={{ fontSize: '16px', color: '#2c3e50', marginTop: 0, marginBottom: '16px', fontWeight: '600' }}>Pezzi ({pezzi.length})</h2>
                {providers.map(provider => {
                  const pezziProvider = pezzi.filter(p => p.provider === provider);
                  if (pezziProvider.length === 0) return null;
                  return (
                    <div key={provider} style={{ background: '#f8f9fa', border: '1px solid #ecf0f1', borderRadius: '8px', padding: '12px', marginBottom: '12px' }}>
                      <h3 style={{ margin: '0 0 12px 0', fontSize: '14px', fontWeight: '600', color: '#2c3e50' }}>{provider} ({pezziProvider.length})</h3>
                      <div style={{ display: 'grid', gap: '8px' }}>
                        {pezziProvider.map(pezzo => (
                          <div key={pezzo.id} style={{ background: 'white', padding: '10px', borderRadius: '6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', border: '1px solid #ecf0f1' }}>
                            <div style={{ flex: 1, fontSize: '12px' }}>
                              <strong>{pezzo.numeroPezzo}</strong> - DMC: {pezzo.dmc} | JD: {pezzo.stampoJD} | Zona: {pezzo.zona || '-'}
                            </div>
                            <button onClick={() => removePezzo(pezzo.id)} style={{ background: '#e74c3c', color: 'white', border: 'none', borderRadius: '4px', padding: '4px 8px', cursor: 'pointer', fontSize: '11px', fontWeight: '500' }}>✕ Rimuovi</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
                <button onClick={generatePDFs} style={{ width: '100%', padding: '14px', background: '#27ae60', color: 'white', border: 'none', borderRadius: '6px', fontSize: '14px', fontWeight: '600', cursor: 'pointer', marginTop: '16px' }}>⬇️ Genera PDF</button>
              </div>
            )}

            {!hasDati && (
              <div style={{ background: 'white', borderRadius: '12px', padding: '50px 24px', textAlign: 'center', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
                <p style={{ fontSize: '32px', margin: '0 0 16px 0' }}>📋</p>
                <p style={{ color: '#7f8c8d', fontSize: '14px', margin: 0 }}>Aggiungi il primo pezzo</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<ScartiApp />);
  </script>
</body>
</html>
